      "text": "Пожалуйста, обратите внимание, что сохранение и экспорт - не одно и то же.\nЕсли вы хотите экспортировать проект как мод для Unturned, используйте функцию 'Экспортировать', вместо 'Сохранить проект'.\nОтветьте 'Да' если хотите чтобы это сообщение было показано снова."
