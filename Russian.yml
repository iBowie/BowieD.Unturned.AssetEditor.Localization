    "nightly":
      "caption": "Спасибо за поддержку! Но также, внимание!"
      "text": "Вы используете Nightly билд программы, всё что вы видите БУДЕТ изменено, а также нестабильно.\nЧасто делайте резервную копию вашего проекта, а если нашли что-то, что не работает - будет хорошим решением уведомить меня об этом!\n\nА теперь, когда с этим разобрались...\nСпасибо за поддержку! Эта программа возможна благодаря людям, поддерживающим меня!"
    "earlyAccess":
      "caption": "Спасибо за поддержку!"
      "text": "Вы используете ранний билд программы, всё что Вы видите ещё может измениться.\nСпасибо за поддержку! Эта программа возможна благодаря людям, поддерживающим меня!"
    "demo":
      "caption": "Добро пожаловать в демо версию!"
      "text": "Вы используете демо версию программы.\nДля улучшения до полной версии, пожалуйста, поддержите разработку программы на Boosty. Спасибо!"
