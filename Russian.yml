      "caption": "Asset Editor аварийно завершил работу!"
      "text":
        "windows": "Попробуйте перезагрузить компьютер. Если проблема сохранится - свяжитесь со мной и приложите этот отчёт.\nСкорее всего, проблема связана с самой Windows, а не с Asset Editor.\n\n{0}"
        "unauthorizedAccess": "Сбой произошёл из-за того, что приложение попыталось обратиться к файлу или папке, к которым у него нет доступа.\nВ большинстве случаев поможет запуск приложения от имени администратора, но сначала рекомендую проверить, действительно ли вам нужен доступ к этому файлу или папке.\n\n{0}"
        "notImplemented": "Вы наткнулись на часть приложения, которая ещё не до конца реализована. Поздравляю!\nВсё равно сообщите об этой проблеме, так как обычно такого происходить не должно.\n\n{0}"
